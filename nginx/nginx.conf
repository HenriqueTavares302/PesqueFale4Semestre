# Configuração do Nginx para o Pesque & Fale.
#
# O Nginx faz três papéis aqui:
#   1. Serve os arquivos estáticos do build do React.
#   2. Resolve o roteamento de uma aplicação de página única.
#   3. Atua como proxy reverso para a API, colocando as duas na mesma
#      origem.
#
# Vai para /etc/nginx/conf.d/default.conf dentro da imagem.

# ── Proxy reverso para a API ──────────────────────────────────────────
#
# O bloco upstream dá um nome a um conjunto de servidores. Com uma entrada
# só, ele já organiza a configuração; com várias, o Nginx distribui as
# requisições entre elas.
#
# "api" é o nome do serviço no docker-compose. O Docker mantém um resolvedor
# de nomes interno, então não é preciso saber o IP do container — que muda a
# cada reinício.
upstream api_pesque_fale {
    server api:3001;

    # Para escalar na horizontal, bastaria subir mais instâncias da API e
    # listá-las aqui:
    #   server api_2:3001;
    #   server api_3:3001;
    #
    # Sem diretiva de método, o Nginx usa round robin: cada requisição vai
    # para o próximo servidor da lista, em ordem.
    #
    # As outras opções vistas em aula:
    #   least_conn;  manda para quem tem menos conexões abertas — melhor
    #                quando as requisições têm durações desiguais
    #   ip_hash;     o mesmo IP sempre cai no mesmo servidor, necessário se
    #                a sessão ficasse na memória do processo. Esta API não
    #                precisa: a sessão está no token JWT, que o cliente
    #                carrega, e por isso qualquer instância atende qualquer
    #                requisição.

    # Mantém conexões abertas com a API em vez de abrir uma por requisição.
    keepalive 32;
}

# ── Compressão ────────────────────────────────────────────────────────
# Texto comprime muito bem: um bundle JavaScript costuma cair a cerca de um
# terço do tamanho. Menos bytes na rede é a melhoria mais barata de tempo de
# carregamento, e o tempo de carregamento entra na avaliação de SEO.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

# Imagem JPEG e PNG já são comprimidas: passar gzip nelas gastaria processador
# sem reduzir nada, por isso não estão na lista.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão do Nginx na resposta de erro, para não entregar a
    # informação a quem procura falha conhecida.
    server_tokens off;

    # ── Cabeçalhos de segurança ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanho máximo do corpo da requisição. O padrão é 1 MB, pequeno demais
    # para o envio de uma foto de pescaria.
    client_max_body_size 10M;

    # ── Roteamento da aplicação de página única ──
    #
    # Esta é a linha indispensável.
    #
    # O build gera um único index.html. As rotas /home, /perfil e /pesquisar
    # existem apenas dentro do JavaScript, no React Router — não há pasta
    # nem arquivo com esses nomes. Navegando pela interface funciona, porque
    # o React troca a tela sem pedir nada ao servidor.
    #
    # O problema aparece quando a pessoa aperta F5 em /perfil, ou abre um
    # link compartilhado: o navegador pede /perfil ao Nginx, que procura o
    # arquivo, não encontra e devolve 404. O site parece quebrado em toda
    # URL que não seja a raiz.
    #
    # O try_files diz: procure o arquivo, depois a pasta, e se nenhum dos
    # dois existir entregue o index.html. O React carrega, lê a URL e mostra
    # a tela certa.
    #
    # É o mesmo papel do rewrite que já está no firebase.json, que cuida
    # disso na hospedagem do Firebase.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache dos arquivos com hash no nome ──
    #
    # O Create React App gera nomes como main.a1b2c3d4.js: o hash muda
    # sempre que o conteúdo muda. Como um nome nunca aponta para dois
    # conteúdos diferentes, o arquivo pode ser guardado por um ano sem risco
    # de o visitante ficar com versão velha — uma mudança no código produz
    # um nome novo, que o navegador busca.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── O index.html nunca é guardado em cache ──
    #
    # Ele é o arquivo que aponta para os demais. Se ficasse em cache, o
    # visitante continuaria recebendo a lista antiga de arquivos e nunca
    # veria uma nova versão do site, mesmo com tudo publicado.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Arquivos de SEO ──
    location = /robots.txt {
        expires 1d;
        access_log off;
    }

    location = /sitemap.xml {
        expires 1d;
        access_log off;
    }

    # O sitemap do catálogo é gerado pela API a partir do banco. Para o
    # buscador, ele parece servido pelo mesmo domínio — o que importa,
    # porque um sitemap só pode listar endereços do próprio site.
    location = /sitemap-catalogo.xml {
        proxy_pass http://api_pesque_fale/sitemap-catalogo.xml;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ── Proxy para a API ──
    #
    # Com /api servido pelo mesmo domínio do site, o navegador vê uma só
    # origem e o CORS deixa de existir no caminho. O front chama /api/eventos
    # e nem precisa saber em que endereço a API roda.
    location /api/ {
        proxy_pass http://api_pesque_fale/api/;
        proxy_http_version 1.1;

        # Sem repassar estes cabeçalhos, a API veria todas as requisições
        # vindas do IP do container do Nginx, e o registro de acesso
        # perderia o IP real do visitante.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para o keepalive do upstream funcionar.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Verificação de saúde ──
    # Endereço que um balanceador de carga consulta para saber se esta
    # instância pode receber tráfego.
    location = /health {
        proxy_pass http://api_pesque_fale/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Nega acesso a arquivo oculto, como um .env que acabe na pasta por
    # engano.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
