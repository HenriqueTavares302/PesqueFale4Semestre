<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon
         Os nomes aqui precisam bater exatamente com os arquivos em public/.
         Antes este bloco apontava para "Favicon.ico" e
         "logofavicon-32x32.png", que não existem: o navegador recebia 404 e
         caía no ícone genérico. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/favicon-180x180.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── SEO ──
         title e description são o que aparece no resultado de busca. A
         description não influencia a posição, mas decide se a pessoa
         clica, e o Google corta por volta de 160 caracteres.
         O componente src/components/Seo/Seo.jsx reescreve estas tags por
         rota; os valores abaixo são o que vale para a página inicial e o
         que os robôs sem JavaScript leem. -->
    <title>Pesque & Fale — Encontre os melhores pontos de pesca</title>
    <meta
      name="description"
      content="Rede social para pescadores: descubra pesqueiros avaliados, acompanhe torneios e compartilhe suas melhores pescarias."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Pesque & Fale" />
    <meta name="theme-color" content="#062A6C" />

    <!-- Endereço oficial da página. Sem ele, o mesmo conteúdo acessado com
         ?utm_source=... conta como página duplicada. -->
    <link rel="canonical" href="https://pesqueefaledb.web.app/" />

    <!-- ── Open Graph ──
         Usado na prévia do link no WhatsApp, Facebook e LinkedIn. Fica no
         HTML, e não só no JavaScript, porque esses robôs não executam
         JavaScript: eles leem apenas o que o servidor entrega. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pesque & Fale" />
    <meta
      property="og:title"
      content="Pesque & Fale — Encontre os melhores pontos de pesca"
    />
    <meta
      property="og:description"
      content="Rede social para pescadores: descubra pesqueiros avaliados, acompanhe torneios e compartilhe suas melhores pescarias."
    />
    <meta property="og:url" content="https://pesqueefaledb.web.app/" />
    <meta
      property="og:image"
      content="https://pesqueefaledb.web.app/favicon-512x512.png"
    />
    <meta property="og:image:alt" content="Logotipo do Pesque & Fale" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter/X usa o próprio conjunto de tags. summary_large_image rende
         a prévia com imagem grande. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Pesque & Fale — Encontre os melhores pontos de pesca"
    />
    <meta
      name="twitter:description"
      content="Rede social para pescadores: descubra pesqueiros avaliados, acompanhe torneios e compartilhe suas melhores pescarias."
    />
    <meta
      name="twitter:image"
      content="https://pesqueefaledb.web.app/favicon-512x512.png"
    />

    <!-- Dados estruturados em JSON-LD.
         Descrevem o site em vocabulário que o buscador entende, o que
         habilita a caixa de busca do site nos resultados. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pesque & Fale",
        "url": "https://pesqueefaledb.web.app/",
        "inLanguage": "pt-BR",
        "description": "Rede social para pescadores: pesqueiros avaliados, torneios e experiências de pesca.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://pesqueefaledb.web.app/pesquisar?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- ── Google Analytics 4 ──
         O Create React App substitui %REACT_APP_GA_ID% pelo valor do .env
         durante o build. O teste antes de carregar a tag existe porque, sem
         a variável definida, o texto fica literal e o navegador tentaria
         buscar um script com "%REACT_APP_GA_ID%" na URL.
         O envio em si fica em src/analytics.js. -->
    <script>
      (function () {
        var id = "%REACT_APP_GA_ID%";
        if (!/^G-[A-Z0-9]+$/.test(id)) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());

        /* send_page_view desligado de propósito: quem conta as páginas é o
           componente RastreioDeRotas, a cada troca de rota. Deixar os dois
           ligados contaria a primeira visita duas vezes. */
        window.gtag("config", id, { send_page_view: false });

        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(tag);
      })();
    </script>
  </head>
  <body>
    <noscript>
      É preciso habilitar o JavaScript para usar o Pesque &amp; Fale.
    </noscript>
    <div id="root"></div>
  </body>
</html>
